name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify bundled artifacts
        run: shasum -a 256 --check SHA256SUMS
      - name: Run release tests
        run: python -m unittest discover -s tests -v
      - name: Run offline mining self-test when Metal is available
        run: |
          if python -c 'import mlx.core as mx; mx.eval(mx.array([1]))'; then
            python miner.py --selftest
          else
            echo "Metal unavailable on this runner; release tests still passed."
          fi
